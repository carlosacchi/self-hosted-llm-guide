name: Manage GPU VM

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose whether to create (apply) or destroy the infrastructure"
        type: choice
        options:
          - apply
          - destroy
        default: apply
      instance_type:
        description: "g5 instance size to launch"
        type: choice
        options:
          - g5.xlarge
          - g5.2xlarge
          - g5.4xlarge
          - g5.8xlarge
          - g5.12xlarge
          - g5.24xlarge
        default: g5.xlarge
      aws_region:
        description: "AWS region to deploy into (eu-west-1/Ireland is cheapest EU option)"
        type: choice
        options:
          - eu-central-1
          - eu-west-1
          - eu-north-1
          - us-east-2
        default: eu-central-1
      availability_zone:
        description: "Optional AZ override, e.g. eu-west-1b. Leave empty to auto-pick the first g5-capable AZ. Set a specific AZ if you hit InsufficientInstanceCapacity."
        required: false
        default: ""
      key_pair_name:
        description: "EC2 key pair name (already created in AWS) for SSH access. Leave empty to deploy without SSH (provisioning still runs via cloud-init)."
        required: false
        default: ""
      ipv4_allowed:
        description: "Single IPv4 address allowed to reach SSH/Web/FastAPI"
        required: true
      enable_llm:
        description: "Deploy the LLM stack (Ollama + Open WebUI, ports 3000/11434)"
        type: boolean
        default: true
      enable_tts:
        description: "Deploy the multi-engine TTS stack (Kokoro/XTTS/Piper, port 7860)"
        type: boolean
        default: true
      vibevoice:
        description: "VibeVoice variant to deploy (they compete for GPU VRAM; pick one). 7B needs ~16 GB."
        type: choice
        options:
          - none
          - "1.5b"
          - realtime
          - "7b"
        default: "1.5b"
      asr:
        description: "Speech-to-text (audio/video/YouTube -> text, port 7864). whisper = multilingual incl. Italian; granite-8b = EN/FR/DE/ES/PT, ~18 GB."
        type: choice
        options:
          - none
          - whisper-large-v3
          - granite-8b
        default: none

# NOTE: workflow_dispatch allows at most 10 inputs. Netdata monitoring is always
# on (Terraform var enable_monitoring defaults to true) and the root volume size
# is fixed at the Terraform default (200 GiB); override it via TF_VAR_root_volume_size
# if you need a different size.

jobs:
  terraform:
    name: Run Terraform
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ inputs.aws_region || 'eu-central-1' }}
      # Region where the Terraform *state* S3 bucket physically lives. This is
      # independent of the deployment region (AWS_REGION) so you can deploy the
      # VM into any region while the state bucket stays put. Override with the
      # TF_STATE_REGION secret if your bucket is not in eu-central-1.
      TF_STATE_REGION: ${{ secrets.TF_STATE_REGION || 'eu-central-1' }}
      # State key is scoped per deploy region. Resources are region-specific, so
      # each region keeps its own independent state file. This prevents cross-region
      # contamination (e.g. a scripts bucket created in eu-central-1 being read with
      # an eu-west-1 endpoint, which returns a 301 PermanentRedirect).
      TF_STATE_KEY: llm-gpu/${{ inputs.aws_region || 'eu-central-1' }}/terraform.tfstate
      TF_VAR_instance_type: ${{ inputs.instance_type }}
      TF_VAR_key_pair_name: ${{ inputs.key_pair_name }}
      TF_VAR_ipv4_allowed: ${{ inputs.ipv4_allowed }}
      TF_VAR_aws_region: ${{ inputs.aws_region || 'eu-central-1' }}
      TF_VAR_availability_zone: ${{ inputs.availability_zone }}
      # Tool selection. Booleans render as true/false; the VibeVoice and ASR
      # choices are fanned out into independent Terraform flags (single-select,
      # since the variants compete for the same 24 GB GPU budget).
      TF_VAR_enable_llm: ${{ inputs.enable_llm }}
      TF_VAR_enable_tts: ${{ inputs.enable_tts }}
      TF_VAR_enable_vibevoice_15b: ${{ inputs.vibevoice == '1.5b' }}
      TF_VAR_enable_vibevoice_realtime: ${{ inputs.vibevoice == 'realtime' }}
      TF_VAR_enable_vibevoice_7b: ${{ inputs.vibevoice == '7b' }}
      TF_VAR_enable_asr: ${{ inputs.asr != 'none' }}
      TF_VAR_asr_model: ${{ inputs.asr == 'none' && 'whisper-large-v3' || inputs.asr }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.1

      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.TF_STATE_REGION }}"

      - name: Terraform Plan
        if: ${{ inputs.action == 'apply' }}
        working-directory: infra
        run: terraform plan -input=false

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: infra
        run: terraform apply -input=false -auto-approve

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: infra
        run: terraform destroy -input=false -auto-approve
