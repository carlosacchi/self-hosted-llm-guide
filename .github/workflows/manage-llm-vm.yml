name: Manage GPU VM

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose whether to create (apply) or destroy the infrastructure"
        type: choice
        options:
          - apply
          - destroy
        default: apply
      instance_type:
        description: "Instance size. g5.* = A10G 24 GB (~$1.2-$7/h). g6e.12xlarge = 4x L40S. The minimax-h3 workload accepts ONLY g7e.12xlarge (2x RTX PRO 6000) -- ref2va renders noise on L40S, see sglang#34110."
        type: choice
        options:
          - g5.xlarge
          - g5.2xlarge
          - g5.4xlarge
          - g5.8xlarge
          - g5.12xlarge
          - g5.24xlarge
          - g6e.12xlarge
          - g7e.12xlarge
        default: g5.xlarge
      aws_region:
        description: "AWS region to deploy into (eu-west-1/Ireland is cheapest EU option; minimax-h3 needs eu-central-1, eu-north-1 or eu-south-2)"
        type: choice
        options:
          - eu-central-1
          - eu-west-1
          - eu-north-1
          - eu-south-2
          - us-east-2
        default: eu-central-1
      availability_zone:
        description: "Optional AZ pin, e.g. eu-west-1b. Leave EMPTY (recommended): the ASG searches every capable AZ, which is the whole point. Pin it only to reproduce a known-good placement."
        required: false
        default: ""
      key_pair_name:
        description: "EC2 key pair name (already created in AWS) for SSH access. Leave empty to deploy without SSH (provisioning still runs via cloud-init)."
        required: false
        default: ""
      ipv4_allowed:
        description: "Single IPv4 address allowed to reach SSH/Web/FastAPI"
        required: true
      workload:
        description: "What to run on the GPU. 'llm-lab' = Ollama + Open WebUI + TTS. 'speech-lab' = TTS only (pair with the vibevoice/asr pickers). 'minimax-h3' = MiniMax-H3 image-reference video+audio ALONE on the box; it needs g7e.12xlarge and disables every other stack."
        type: choice
        options:
          - llm-lab
          - speech-lab
          - minimax-h3
        default: llm-lab
      vibevoice:
        description: "VibeVoice variant to deploy (they compete for GPU VRAM; pick one). 7B needs ~16 GB. Ignored when workload is minimax-h3."
        type: choice
        options:
          - none
          - "1.5b"
          - realtime
          - "7b"
        default: "1.5b"
      asr:
        description: "Speech-to-text (audio/video/YouTube -> text, port 7864). whisper = multilingual incl. Italian; granite-8b = EN/FR/DE/ES/PT, ~18 GB. Ignored when workload is minimax-h3."
        type: choice
        options:
          - none
          - whisper-large-v3
          - granite-8b
        default: none
      auto_stop_hours:
        description: "Hard time-to-live: stop the VM this many hours after boot, whatever happens. '0' disables it. Idle-stop (30 min) and the 01:00 nightly scale-to-zero apply on top."
        type: choice
        options:
          - "2"
          - "4"
          - "8"
          - "0"
        default: "4"

# NOTE: workflow_dispatch allows at most 10 inputs and this list uses all 10.
#
# That cap is why 'workload' exists as a single picker instead of separate
# enable_llm / enable_tts booleans: adding MiniMax-H3 needed a slot, and the
# stacks were never freely combinable anyway (they compete for the same VRAM,
# and H3 is exclusive by construction).
#
# Netdata monitoring is always on (Terraform var enable_monitoring defaults to
# true). Root volume size is derived from the workload below; override it with
# TF_VAR_root_volume_size if you need something else.

jobs:
  terraform:
    name: Run Terraform
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ inputs.aws_region || 'eu-central-1' }}
      # Region where the Terraform *state* S3 bucket physically lives. This is
      # independent of the deployment region (AWS_REGION) so you can deploy the
      # VM into any region while the state bucket stays put. Override with the
      # TF_STATE_REGION secret if your bucket is not in eu-central-1.
      TF_STATE_REGION: ${{ secrets.TF_STATE_REGION || 'eu-central-1' }}
      # State key is scoped per deploy region. Resources are region-specific, so
      # each region keeps its own independent state file. This prevents cross-region
      # contamination (e.g. a scripts bucket created in eu-central-1 being read with
      # an eu-west-1 endpoint, which returns a 301 PermanentRedirect).
      TF_STATE_KEY: llm-gpu/${{ inputs.aws_region || 'eu-central-1' }}/terraform.tfstate
      TF_VAR_instance_type: ${{ inputs.instance_type }}
      TF_VAR_key_pair_name: ${{ inputs.key_pair_name }}
      TF_VAR_ipv4_allowed: ${{ inputs.ipv4_allowed }}
      TF_VAR_aws_region: ${{ inputs.aws_region || 'eu-central-1' }}
      TF_VAR_availability_zone: ${{ inputs.availability_zone }}
      # Tool selection. The single 'workload' picker is fanned out into the
      # independent Terraform flags, same technique already used for the
      # VibeVoice and ASR variants (single-select, since they compete for the
      # same VRAM budget).
      #
      # minimax-h3 forces every other GPU stack off: Terraform enforces the same
      # rule with a precondition, so a hand-edited run still fails in `plan`
      # rather than OOMing 20 minutes into a $13/h boot.
      TF_VAR_enable_h3: ${{ inputs.workload == 'minimax-h3' }}
      TF_VAR_enable_llm: ${{ inputs.workload == 'llm-lab' }}
      TF_VAR_enable_tts: ${{ inputs.workload == 'llm-lab' || inputs.workload == 'speech-lab' }}
      TF_VAR_enable_vibevoice_15b: ${{ inputs.workload != 'minimax-h3' && inputs.vibevoice == '1.5b' }}
      TF_VAR_enable_vibevoice_realtime: ${{ inputs.workload != 'minimax-h3' && inputs.vibevoice == 'realtime' }}
      TF_VAR_enable_vibevoice_7b: ${{ inputs.workload != 'minimax-h3' && inputs.vibevoice == '7b' }}
      TF_VAR_enable_asr: ${{ inputs.workload != 'minimax-h3' && inputs.asr != 'none' }}
      TF_VAR_asr_model: ${{ inputs.asr == 'none' && 'whisper-large-v3' || inputs.asr }}

      # H3 needs room for the 144 GB Ref2VA partition plus the SGLang image, and
      # gp3's default 125 MiB/s would spend ~19 minutes just writing those
      # weights (and re-reading them on every later boot). 1000 MiB/s cuts that
      # to a couple of minutes for a few dollars a month.
      TF_VAR_root_volume_size: ${{ inputs.workload == 'minimax-h3' && '350' || '200' }}
      TF_VAR_root_volume_throughput: ${{ inputs.workload == 'minimax-h3' && '1000' || '125' }}

      # Cost guardrails (see scripts/provision_autostop.sh).
      TF_VAR_auto_stop_hours: ${{ inputs.auto_stop_hours }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.1

      - name: Terraform Init
        working-directory: infra/aws
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.TF_STATE_REGION }}"

      - name: Terraform Plan
        if: ${{ inputs.action == 'apply' }}
        working-directory: infra/aws
        run: terraform plan -input=false

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: infra/aws
        run: terraform apply -input=false -auto-approve

      # `apply` does not wait for capacity: the ASG keeps hunting across every
      # capable instance type and AZ in the background. This is the only place
      # that reports whether it actually found a GPU, and why not.
      - name: Report capacity hunt
        if: ${{ inputs.action == 'apply' }}
        working-directory: infra/aws
        run: |
          ASG="$(terraform output -raw asg_name)"
          echo "Auto Scaling group: $ASG"
          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG" \
            --query 'AutoScalingGroups[0].Instances[].[InstanceId,InstanceType,AvailabilityZone,LifecycleState]' \
            --output table
          aws autoscaling describe-scaling-activities \
            --auto-scaling-group-name "$ASG" \
            --max-items 10 \
            --query 'Activities[].[StartTime,StatusCode,StatusMessage]' \
            --output table

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: infra/aws
        run: terraform destroy -input=false -auto-approve
